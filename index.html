
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little Space</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f3f1;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #494541;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 42px 28px;
      text-align: center;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 12px 35px #0000000c;
    }

    .flower {
      font-size: 34px;
      color: #d8aebd;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 27px;
      margin: 8px 0 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #aaa3a0;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #e7e2df;
      border-radius: 14px;
      background: #faf9f8;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d9bfc1;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: none;
      border-radius: 14px;
      background: #494541;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.85;
    }

    #message {
      margin-top: 20px;
      color: #c49b9f;
      font-size: 14px;
    }

    .footer {
      margin-top: 30px;
      color: #c5bfbb;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="flower">♡</div>

    <h1>Our Little Space</h1>

    <p class="subtitle">
      A little corner of the world,<br>
      just for us.
    </p>

    <input
      id="password"
      type="password"
      placeholder="Enter the password"
    >

    <button onclick="unlock()">Enter</button>

    <p id="message"></p>

    <div class="footer">MADE WITH LOVE ♡</div>
  </main>


<script>
const STORAGE_KEY = "our-little-space-v1";

function toBase64(bytes) {
  return btoa(String.fromCharCode(...bytes));
}

function fromBase64(text) {
  return Uint8Array.from(atob(text), c => c.charCodeAt(0));
}

async function makeKey(password, salt) {
  const encoder = new TextEncoder();
  const material = await crypto.subtle.importKey(
    "raw",
    encoder.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt,
      iterations: 310000,
      hash: "SHA-256"
    },
    material,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function unlock() {
  const input = document.getElementById("password");
  const message = document.getElementById("message");
  const password = input.value;

  if (!password) {
    message.textContent = "Please enter a password.";
    return;
  }

  try {
    let saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await makeKey(password, salt);

      const data = new TextEncoder().encode(
        "Welcome to our little space. ♡"
      );

      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv },
        key,
        data
      );

      saved = JSON.stringify({
        salt: toBase64(salt),
        iv: toBase64(iv),
        data: toBase64(new Uint8Array(encrypted))
      });

      localStorage.setItem(STORAGE_KEY, saved);
      message.textContent = "Your little space is ready. ♡";
    } else {
      const record = JSON.parse(saved);
      const key = await makeKey(
        password,
        fromBase64(record.salt)
      );

      const decrypted = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: fromBase64(record.iv)
        },
        key,
        fromBase64(record.data)
      );

      message.textContent = new TextDecoder().decode(decrypted);
    }
  } catch (error) {
    message.textContent = "Incorrect password. Try again. ♡";
  }
}
</script>

</body>
</html>
